name: Release

# Builds the static single-file desktop application for both platforms and
# publishes it as a GitHub release.
#
# Triggered by a "v*" tag push, or manually with an explicit tag.  Release
# artifacts are always built with the default ASR_CPU_ARCH=x86-64-v3 (portable
# down to Haswell 2013) and with ASR_TOOLS=OFF, so the asr_test numerical
# self-test (which needs golden files that CI does not have) is not shipped.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

env:
  ASR_DEPS_KEY: ggml-ffa4e8b80930029a35991f94e7c8a93cd67730ab-imgui-v1.92.9b-glfw-3.4-miniaudio-0.11.25-json-v3.11.3
  # Tag push -> github.ref_name, manual run -> the "tag" input.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: release-linux-x86_64
            suffix: linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            artifact: release-windows-x86_64
            suffix: windows-x86_64

    steps:
      # A manual run must build the commit the tag points at, not the branch it
      # was dispatched from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check the release tag
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "::error::release tag must look like v1.2.3, got '$RELEASE_TAG'"; exit 1 ;;
          esac

      - name: Cache fetched third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: ${{ runner.os }}-third-party-${{ env.ASR_DEPS_KEY }}-${{ hashFiles('cmake/deps.cmake') }}

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libcurl4-openssl-dev \
            libx11-dev libxext-dev libxi-dev libxtst-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev

      # The version baked into the binary comes from the tag, so a release can
      # never ship a binary that reports a different version than its name.
      # bash on both platforms: the continuation lines below are bash syntax, and
      # the default shell on the Windows runners is pwsh, which reads a trailing
      # backslash as a literal argument and then fails on the next line.
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DASR_TOOLS=OFF \
            -DASR_CPU_ARCH=x86-64-v3 \
            -DASR_VERSION="${RELEASE_TAG#v}"

      - name: Build
        if: runner.os == 'Linux'
        run: cmake --build build -j "$(nproc)"

      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release

      # CLI-only smoke tests: they run headless, the GUI is never started.
      - name: Smoke test
        if: runner.os == 'Linux'
        run: |
          ./build/bin/npa_asr --help
          ./build/bin/npa_asr --info
          ./build/bin/npa_asr --info | grep -q "compiled for: x86-64-v3"
          ./build/bin/npa_asr --info | grep -q "npa_asr ${RELEASE_TAG#v}"
          ./build/bin/npa_asr --list-models || [ $? -le 1 ]

      - name: Smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          build\bin\npa_asr.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = build\bin\npa_asr.exe --info | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($info -notmatch 'compiled for: x86-64-v3') { throw 'unexpected CPU baseline in --info' }
          if ($info -notmatch [regex]::Escape("npa_asr $($env:RELEASE_TAG -replace '^v','')")) { throw 'binary version does not match the tag' }
          build\bin\npa_asr.exe --list-models
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0

      - name: Add "npa_asr --info" to the job summary
        if: runner.os == 'Linux'
        run: |
          {
            echo '### npa_asr --info'
            echo '```'
            ./build/bin/npa_asr --info 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add "npa_asr --info" to the job summary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # stdout only: no 2>&1, so stderr cannot turn into a terminating
          # error under the runner's $ErrorActionPreference = 'stop'
          $info = & build\bin\npa_asr.exe --info | Out-String
          Write-Output $info
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### npa_asr --info'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $info
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'

      - name: Stage the release asset
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp build/bin/npa_asr "dist/npa_asr-${version}-${{ matrix.suffix }}"
          # The application reads the model catalogue from
          # releases/latest/download/manifest.json (src/net/manifest.cpp), and
          # after this release "latest" is the application, not the models
          # release - so the catalogue travels with it.
          cp models/manifest.json dist/manifest.json
          ls -l dist

      - name: Stage the release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\bin\npa_asr.exe "dist\npa_asr-$version-${{ matrix.suffix }}.exe"
          Get-ChildItem dist

      - name: Upload the release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the release assets
        run: ls -l dist

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
