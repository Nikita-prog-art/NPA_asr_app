name: Convert GigaAM-v3 e2e_rnnt to GGUF

# One-off job: downloads the PyTorch checkpoint from Hugging Face, converts it to
# GGUF in several quantization levels and publishes them as release assets,
# together with models/manifest.json which the application reads to offer
# downloads.  The manifest is also committed back to the repository.
#
# It only ever needs to run once (or again if the upstream checkpoint changes or
# a new quantization level is wanted): start it manually from the Actions tab.
# It is deliberately not triggered by a push, so a normal commit can never kick
# off a 500 MB model conversion.

on:
  workflow_dispatch:
    inputs:
      quants:
        description: 'Quantizations to build (space separated)'
        default: 'f16 q8_0 q5_0 q4_0'
        required: true
      recommend:
        description: 'Quantization the app suggests in the catalogue (must be in quants)'
        default: 'q4_0'
        required: true
      release_tag:
        description: 'Release tag the assets are published to'
        default: 'models-v3-e2e_rnnt'
        required: true

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # gguf-py is pinned: its API for quantized tensors (add_tensor with
          # raw_dtype and the byte-shaped tensor) is what the converter targets.
          pip install gguf==0.19.0 numpy sentencepiece

      - name: Download the Hugging Face checkpoint (revision e2e_rnnt)
        run: |
          set -euo pipefail
          mkdir -p models/hf/gigaam-v3-e2e_rnnt
          cd models/hf/gigaam-v3-e2e_rnnt
          B=https://huggingface.co/ai-sage/GigaAM-v3/resolve/e2e_rnnt
          curl -fL --retry 5 --retry-delay 3 -o config.json        "$B/config.json"
          curl -fL --retry 5 --retry-delay 3 -o tokenizer.model    "$B/tokenizer.model"
          curl -fL --retry 5 --retry-delay 3 -o pytorch_model.bin  "$B/pytorch_model.bin"
          ls -la

      - name: Convert to GGUF
        env:
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          RECOMMEND="${{ github.event.inputs.recommend || 'q4_0' }}"
          rm -f models/manifest.json
          for q in ${{ github.event.inputs.quants || 'f16 q8_0 q5_0 q4_0' }}; do
            REC=""
            if [ "$q" = "$RECOMMEND" ]; then REC="--recommend"; fi
            python tools/convert_gigaam_to_gguf.py \
              --model-dir models/hf/gigaam-v3-e2e_rnnt \
              --out "models/gguf/gigaam-v3-e2e_rnnt-${q}.gguf" \
              --quant "${q}" \
              --manifest models/manifest.json \
              --release-base "${BASE}" $REC
          done
          # the mark has to end up on exactly one quantization
          test "$(grep -c '"recommended": true' models/manifest.json)" = "1"
          grep -B4 '"recommended": true' models/manifest.json
          echo '--- manifest ---'
          cat models/manifest.json
          ls -la models/gguf

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "GigaAM-v3 e2e_rnnt GGUF models" \
            --notes "Pre-converted GGUF weights for ai-sage/GigaAM-v3 (revision \`e2e_rnnt\`).
          The application downloads the quantization you pick from this release.
          Generated by .github/workflows/convert-model.yml."
          gh release upload "$TAG" models/gguf/*.gguf models/manifest.json --clobber

      - name: Commit the manifest so the app finds it on the main branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/manifest.json
          git commit -m "models: update GGUF manifest [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"
