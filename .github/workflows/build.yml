name: Build

# Builds the single-file desktop application (GUI + CLI) on Linux and Windows.
#
# The build is fully static: ggml is compiled in, no runtime-dispatched backend
# libraries are produced, and the only dynamic dependencies left on Linux are
# system libraries (libX11, libGL, libcurl).
#
# ASR_CPU_ARCH keeps its default value x86-64-v3, which is portable down to
# Haswell (2013).  Never pass -DASR_NATIVE=ON for artifacts that are handed to
# users: it would bake in the ISA extensions of the GitHub runner CPU.

on:
  # On demand only: releases are built by release.yml (push of a v* tag), and
  # this workflow is the manual smoke build for a branch or a pull request.
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned third-party versions from cmake/deps.cmake.  Together with the runner
  # OS and the hash of deps.cmake this builds the dependency cache key.
  ASR_DEPS_KEY: ggml-ffa4e8b80930029a35991f94e7c8a93cd67730ab-imgui-v1.92.9b-glfw-3.4-miniaudio-0.11.25-json-v3.11.3

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: npa_asr-linux-x86_64
            binary: build/bin/npa_asr
          - name: Windows x86_64
            os: windows-latest
            artifact: npa_asr-windows-x86_64
            binary: build/bin/npa_asr.exe

    steps:
      - uses: actions/checkout@v4

      # third_party/ is gitignored and populated at configure time by
      # cmake/deps.cmake (sources in third_party/<name>, FetchContent scratch
      # space in third_party/_fetched), so it can safely be cached wholesale.
      - name: Cache fetched third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: ${{ runner.os }}-third-party-${{ env.ASR_DEPS_KEY }}-${{ hashFiles('cmake/deps.cmake') }}

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libcurl4-openssl-dev \
            libx11-dev libxext-dev libxi-dev libxtst-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DASR_CPU_ARCH=x86-64-v3

      - name: Build
        if: runner.os == 'Linux'
        run: cmake --build build -j "$(nproc)"

      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release

      # CLI-only smoke tests: they run headless, the GUI is never started.
      - name: Smoke test
        if: runner.os == 'Linux'
        run: |
          ./build/bin/npa_asr --help
          ./build/bin/npa_asr --info
          # the artifact must carry the portable baseline, not the runner's CPU
          ./build/bin/npa_asr --info | grep -q "compiled for: x86-64-v3"
          # exits 1 when there are no local models; anything above that is a crash
          ./build/bin/npa_asr --list-models || [ $? -le 1 ]

      - name: Smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          build\bin\npa_asr.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = build\bin\npa_asr.exe --info | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($info -notmatch 'compiled for: x86-64-v3') { throw 'unexpected CPU baseline in --info' }
          # exits 1 when there are no local models; anything above that is a crash
          build\bin\npa_asr.exe --list-models
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0

      - name: Add "npa_asr --info" to the job summary
        if: runner.os == 'Linux'
        run: |
          {
            echo '### npa_asr --info'
            echo '```'
            ./build/bin/npa_asr --info 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add "npa_asr --info" to the job summary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # stdout only: no 2>&1, so stderr cannot turn into a terminating
          # error under the runner's $ErrorActionPreference = 'stop'
          $info = & build\bin\npa_asr.exe --info | Out-String
          Write-Output $info
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### npa_asr --info'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $info
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'

      # The build output is one self-contained executable, nothing else.
      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          retention-days: 14
          if-no-files-found: error
